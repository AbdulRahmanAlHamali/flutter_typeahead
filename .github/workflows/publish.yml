name: Publish

on:
  workflow_dispatch:
    # This workflow must be run from a Tag. A branch is not allowed.

jobs:
  publish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    # we'd prefer the reusable workflow, but
    # but it is broken for flutter packages: https://github.com/dart-lang/setup-dart/issues/68
    # uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
      - uses: subosito/flutter-action@v2
      - name: Install dependencies
        run: dart pub get
      - name: Publish to pub.dev
        run: dart pub publish -f
